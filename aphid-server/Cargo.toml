[package]
name = "aphid-server"
version = "0.5.1"
edition = "2024"
rust-version = "1.94"
description = "A small production static-file server for sites built with aphid."
license = "MIT OR Apache-2.0"
repository = "https://github.com/LHelge/aphid"
homepage = "https://aphid.lhelge.se"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-http = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs", "internal-logs"] }
opentelemetry_sdk = "0.33.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
webpki-root-certs = "1.0.12"

[dev-dependencies]
opentelemetry-semantic-conventions = { version = "0.33.1", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
reqwest = "0.13.5"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
