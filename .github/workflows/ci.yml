name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  stack:
    name: hoster stack check
    runs-on: ubuntu-latest
    env:
      # The hoster release running on hoster.lhelge.se.
      HOSTER_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check the docs stack file
        run: |
          set -euo pipefail
          base="https://github.com/LHelge/hoster/releases/download/$HOSTER_VERSION"
          curl -fsSLO "$base/hoster-x86_64-unknown-linux-musl" -O "$base/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          install -m 755 hoster-x86_64-unknown-linux-musl hoster
          ./hoster stack check --deny-warnings docs/hoster/aphid-docs.stack.toml
